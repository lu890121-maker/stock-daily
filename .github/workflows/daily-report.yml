name: Daily Stock Report

# DISABLED - Report now generated manually by WorkBuddy automation
# on:
#   schedule:
#     - cron: '30 7 * * *'
#
#   workflow_dispatch:

on:
  workflow_dispatch:  # Keep manual trigger only

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch market data and generate report
      env:
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      run: |
        python generate_report.py

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add -A
        git diff --staged --quiet || git commit -m "Update daily report $(date +%Y-%m-%d)"
        git push
